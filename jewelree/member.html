<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Membership · Jewelree Atelier</title>
  <meta name="description" content="Jewelree membership: poin di setiap pembelian, harga khusus, resize & polish gratis, dan akses awal koleksi baru.">
  <meta name="theme-color" content="#1E3A5F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/monogram.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site.css">
  <style>
    .auth { display: grid; grid-template-columns: 1fr 1fr; min-height: 640px; margin-top: 40px; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--line); }
    .auth .side { background: var(--ink); color: var(--ivory); padding: clamp(30px, 5vw, 60px); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
    .auth .side .orbits { width: 600px; left: -120px; top: -160px; opacity: .3; }
    .auth .side .eyebrow { color: var(--gold); }
    .auth .side h1 { font-size: clamp(2.6rem, 5vw, 4rem); font-weight: 400; margin: 12px 0; }
    .auth .side ul { list-style: none; display: grid; gap: 8px; margin-top: 18px; opacity: .85; font-size: .92rem; }
    .auth .side li::before { content: "—  "; color: var(--gold); }
    .auth form { padding: clamp(30px, 5vw, 60px); display: flex; flex-direction: column; gap: 16px; justify-content: center; background: #fff; }
    .auth form h2 { font-size: 2.2rem; }
    .auth form p { color: var(--muted); font-size: .9rem; }
    .otp-hint { background: var(--ivory); padding: 10px 14px; border-radius: var(--radius); font-size: .82rem; }

    .dash { display: grid; grid-template-columns: 380px 1fr; gap: 28px; margin-top: 40px; align-items: start; }
    .mcard { aspect-ratio: 1.6; border-radius: 14px; padding: 22px 24px; color: var(--ivory); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 30px 50px -30px rgba(0,0,0,.55); }
    .mcard.ivory { background: linear-gradient(135deg, #efe6d3, #cfc3a8); color: var(--charcoal); }
    .mcard.copper { background: linear-gradient(135deg, #c98a4d, #7d4a1f); }
    .mcard.ink { background: linear-gradient(135deg, #24476f, #0f1f36); }
    .mcard .orbits { width: 380px; right: -120px; top: -100px; opacity: .35; }
    .mcard .top { display: flex; justify-content: space-between; align-items: center; position: relative; }
    .mcard .mono { width: 34px; color: var(--gold); }
    .mcard.ivory .mono { color: var(--copper); }
    .mcard .tier { font-size: .66rem; letter-spacing: .3em; text-transform: uppercase; font-weight: 700; }
    .mcard b { font-family: var(--font-display); font-size: 1.7rem; font-weight: 500; display: block; position: relative; }
    .mcard small { font-size: .72rem; letter-spacing: .14em; opacity: .8; position: relative; }
    .progress { margin-top: 18px; }
    .progress .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 8px 0; }
    .progress .bar i { display: block; height: 100%; background: var(--copper); }
    .progress small { color: var(--muted); font-size: .8rem; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; }
    .stat b { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; display: block; line-height: 1.1; }
    .stat span { font-size: .75rem; color: var(--muted); }
    .perks { margin-top: 18px; background: var(--ivory); padding: 18px; border-radius: var(--radius-lg); }
    .perks h3 { font-family: var(--font-body); font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; }
    .perks ul { list-style: none; display: grid; gap: 6px; font-size: .9rem; }
    .perks li::before { content: "—  "; color: var(--copper); }

    .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
    .tabs button { padding: 12px 0; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
    .tabs button.on { color: var(--charcoal); border-color: var(--copper); }
    .orow { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: .9rem; }
    .orow b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
    .orow small { color: var(--muted); display: block; }
    .badge { font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--ivory-2); }
    .rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .reward { border: 1px solid var(--line); background: #fff; border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; gap: 8px; }
    .reward b { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
    .reward small { color: var(--muted); }
    .reward button { margin-top: auto; }
    .muted { color: var(--muted); }
    @media (max-width: 900px) { .auth, .dash { grid-template-columns: 1fr; } .auth .side { min-height: 320px; } }
  </style>
</head>
<body>
<div data-site-head></div>
<main class="wrap" id="main"></main>
<div data-site-foot></div>

<script src="jewelree-data.js"></script>
<script src="site.js"></script>
<script>
  const main = document.getElementById("main");
  const ORBITS = `<svg class="orbits" viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width=".7" aria-hidden="true"><circle cx="200" cy="200" r="150"/><ellipse cx="200" cy="200" rx="190" ry="70" transform="rotate(-20 200 200)"/><ellipse cx="200" cy="200" rx="170" ry="110" transform="rotate(35 200 200)"/></svg>`;
  const REWARDS = [{ pts: 250, name: "Pembersihan & polish", note: "Di atelier atau via kurir" }, { pts: 500, name: "Voucher Rp 250.000", note: "Untuk pembelian berikutnya" }, { pts: 1200, name: "Ukir nama", note: "Hingga 12 karakter" }, { pts: 2500, name: "Voucher Rp 1.500.000", note: "Berlaku 6 bulan" }];
  let tab = "orders";

  function login() {
    let step = "phone", pending = {};
    const draw = () => {
      main.innerHTML = `<div class="auth">
        <div class="side">${ORBITS}<span class="eyebrow">Jewelree membership</span><h1>Made to be kept.</h1>
          <ul><li>Poin di setiap pembelian, online dan di atelier</li><li>Ivory → Copper → Ink, naik otomatis</li><li>Resize, polish, dan ukir nama gratis</li><li>Sertifikat semua piece Anda di satu tempat</li></ul></div>
        <form id="f">${step === "phone"
          ? `<h2>Masuk atau daftar</h2><p>Cukup nomor WhatsApp. Kami kirim kode sekali pakai — tanpa password.</p>
             <div class="field"><label for="name">Nama</label><input id="name" autocomplete="name" placeholder="Untuk member baru"></div>
             <div class="field"><label for="phone">Nomor WhatsApp</label><input id="phone" inputmode="tel" required placeholder="0812…" autocomplete="tel"></div>
             <button class="btn btn-ink">Kirim kode</button>
             <p style="font-size:.8rem">Sudah pernah belanja? Gunakan nomor yang sama — riwayat pesanan otomatis tersambung.</p>`
          : `<h2>Masukkan kode</h2><p>Kode 6 digit dikirim ke WhatsApp ${JW.esc(pending.phone)}.</p>
             <div class="otp-hint">Demo: kodenya <b>246810</b>. Di versi live dikirim lewat WhatsApp/SMS.</div>
             <div class="field"><label for="otp">Kode</label><input id="otp" inputmode="numeric" maxlength="6" required autocomplete="one-time-code"></div>
             <button class="btn btn-ink">Masuk</button><button type="button" class="btn btn-line" id="back">Ganti nomor</button>`}
        </form></div>`;
      document.getElementById("back")?.addEventListener("click", () => { step = "phone"; draw(); });
      document.getElementById("f").addEventListener("submit", (e) => {
        e.preventDefault();
        if (step === "phone") {
          const phone = document.getElementById("phone").value.replace(/\D/g, "");
          if (phone.length < 9) return Site.toast("Nomor WhatsApp belum lengkap");
          pending = { phone, name: document.getElementById("name").value.trim() }; step = "otp"; draw(); document.getElementById("otp").focus();
        } else {
          if (document.getElementById("otp").value !== "246810") return Site.toast("Kode salah. Demo: 246810");
          const all = JW.members(); let m = all.find((x) => x.phone.replace(/\D/g, "") === pending.phone);
          if (!m) { m = { id: "m" + Date.now(), name: pending.name || "Member Jewelree", phone: pending.phone, email: "", city: "", joined: JW.today(), points: 100, spend: 0 }; all.push(m); JW.saveMembers(all); Site.toast("Selamat datang! Bonus 100 poin"); }
          JStore.set("jewelree.session", m.id);
          const next = new URLSearchParams(location.search).get("next");
          if (next === "checkout.html") location.href = next; else location.reload();
        }
      });
    };
    draw();
  }

  function dashboard(me) {
    const tier = JW.tier(me.spend || 0); const idx = TIERS.indexOf(tier); const next = TIERS[idx + 1];
    const pct = next ? Math.min(100, ((me.spend || 0) - tier.min) / (next.min - tier.min) * 100) : 100;
    const orders = JW.orders().filter((o) => o.memberId === me.id || o.customer.phone.replace(/\D/g, "") === me.phone.replace(/\D/g, "")).reverse();
    const certs = JW.certs().filter((c) => c.owner === me.name);
    const wish = JW.wishlist().map(JW.product).filter(Boolean);
    main.innerHTML = `<div class="dash">
      <aside>
        <div class="mcard ${tier.id}">${ORBITS}<div class="top"><span class="mono">${MONOGRAM}</span><span class="tier">${tier.name} member</span></div>
          <div><b>${JW.esc(me.name)}</b><small>NO. ${me.id.toUpperCase().slice(0, 8)} · SEJAK ${new Date(me.joined).getFullYear()}</small></div></div>
        <div class="progress">${next ? `<div class="bar"><i style="width:${pct}%"></i></div><small>${JW.rp(next.min - (me.spend || 0))} lagi menuju <b>${next.name}</b></small>` : `<small>Anda di tingkat tertinggi. Terima kasih.</small>`}</div>
        <div class="stats"><div class="stat"><b>${(me.points || 0).toLocaleString("id-ID")}</b><span>Poin</span></div><div class="stat"><b>${JW.rpShort(me.spend || 0)}</b><span>Total belanja</span></div></div>
        <div class="perks"><h3>Benefit ${tier.name}</h3><ul>${tier.perks.map((p) => `<li>${p}</li>`).join("")}</ul></div>
        <p style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-line" data-install>Pasang app</button><button class="btn btn-line" id="logout">Keluar</button></p>
      </aside>
      <section>
        <div class="tabs">${[["orders", "Pesanan"], ["certs", "Sertifikat saya"], ["rewards", "Tukar poin"], ["wish", "Wishlist"]].map(([k, n]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${n}</button>`).join("")}</div>
        <div id="pane">${{
          orders: orders.length ? orders.map((o) => `<div class="orow"><div><b>${o.items.map((i) => JW.esc(i.name)).join(", ")}</b><small>${o.no} · ${JW.date(o.at)} · ${o.payment}</small></div><span class="badge">${o.status}</span><span>${JW.rp(o.total)}</span></div>`).join("") : `<p class="muted">Belum ada pesanan. <a href="index.html#koleksi">Lihat koleksi</a></p>`,
          certs: certs.length ? certs.map((c) => { const p = JW.product(c.product); return `<div class="orow"><div><b>${JW.esc(p.name)}</b><small>${c.code} · ${c.serial} · terdaftar ${c.registered ? JW.date(c.registered) : "—"}</small></div><span class="badge">${c.status === "flagged" ? "Perlu dicek" : "Asli"}</span><a href="verify.html?code=${c.code}">Lihat</a></div>`; }).join("") : `<p class="muted">Belum ada sertifikat atas nama Anda. Belanja sebagai member atau daftarkan kode di <a href="verify.html">halaman cek keaslian</a>.</p>`,
          rewards: `<div class="rewards">${REWARDS.map((r, i) => `<div class="reward"><small>${r.pts.toLocaleString("id-ID")} poin</small><b>${r.name}</b><small>${r.note}</small><button class="btn ${me.points >= r.pts ? "btn-ink" : "btn-line"}" data-redeem="${i}" ${me.points >= r.pts ? "" : "disabled"}>Tukar</button></div>`).join("")}</div>`,
          wish: wish.length ? `<div class="grid">${wish.map(Site.card).join("")}</div>` : `<p class="muted">Simpan piece favorit dengan ikon hati.</p>`,
        }[tab]}</div>
      </section></div>`;
    Site.bindWish(main);
    main.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; dashboard(JW.me()); }));
    main.querySelectorAll("[data-redeem]").forEach((b) => b.addEventListener("click", () => {
      const r = REWARDS[+b.dataset.redeem]; JW.saveMe({ id: me.id, points: me.points - r.pts });
      Site.toast(`${r.name} ditukar. Kode dikirim ke WhatsApp.`); dashboard(JW.me());
    }));
    document.getElementById("logout").addEventListener("click", () => { JStore.del("jewelree.session"); location.reload(); });
  }

  JW.ensureSample();
  const me = JW.me();
  me ? dashboard(me) : login();
</script>
</body>
</html>
