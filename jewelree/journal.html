<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Journal · Panduan Perhiasan Emas | Jewelree Atelier</title>
  <meta name="description" content="Panduan memilih, merawat, dan memastikan keaslian perhiasan emas, safir, dan mutiara dari atelier Jewelree.">
  <meta name="theme-color" content="#1E3A5F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/monogram.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site.css">
  <style>
    .j-head { padding: clamp(50px, 8vw, 90px) 0 30px; text-align: center; }
    .j-head .eyebrow { color: var(--copper); }
    .j-head h1 { font-size: clamp(3rem, 8vw, 6rem); font-weight: 400; margin-top: 10px; }
    .j-head h1 em { font-style: italic; }
    .j-head p { color: var(--muted); max-width: 52ch; margin: 14px auto 0; }
    .feature { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center; text-decoration: none; margin-top: 30px; }
    .feature .pic { aspect-ratio: 4/3; overflow: hidden; border-radius: 2px; }
    .feature .pic svg { width: 100%; height: 100%; }
    .feature h2 { font-size: clamp(2.2rem, 4.5vw, 3.4rem); margin: 10px 0 14px; }
    .feature p { color: var(--muted); }
    .meta { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; margin-top: 70px; }
    .list a { text-decoration: none; display: flex; flex-direction: column; gap: 10px; }
    .list .pic { aspect-ratio: 3/2; overflow: hidden; border-radius: 2px; }
    .list .pic svg { width: 100%; height: 100%; }
    .list h3 { font-size: 1.5rem; }

    article { max-width: 720px; margin: 0 auto; padding-top: 50px; }
    article .crumbs { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    article .crumbs a { text-decoration: none; }
    article h1 { font-size: clamp(2.6rem, 6vw, 4.2rem); margin: 18px 0 14px; }
    article .cover { aspect-ratio: 16/9; overflow: hidden; margin: 30px 0; border-radius: 2px; }
    article .cover svg { width: 100%; height: 100%; }
    article .body p { font-size: 1.12rem; line-height: 1.8; margin-bottom: 20px; }
    article .body p:first-child::first-letter { font-family: var(--font-display); font-size: 4.2rem; float: left; line-height: .85; padding: 6px 10px 0 0; color: var(--copper); }
    .shop-the-story { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 30px; }
    .shop-the-story h2 { font-size: 2rem; margin-bottom: 20px; }
    .seo-note { margin-top: 40px; background: var(--ivory); border-left: 3px solid var(--copper); padding: 16px 20px; font-size: .86rem; color: var(--muted); }
    .seo-note b { color: var(--text); }
    @media (max-width: 860px) { .feature, .list { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div data-site-head></div>
<main class="wrap" id="main"></main>
<div data-site-foot></div>

<script src="jewelree-data.js"></script>
<script src="site.js"></script>
<script>
  const main = document.getElementById("main");
  const posts = JW.posts().filter((p) => p.status === "Terbit").sort((a, b) => b.date.localeCompare(a.date));
  const mins = (p) => Math.max(3, Math.round(p.body.join(" ").split(/\s+/).length / 200) + 3);
  const slug = new URLSearchParams(location.search).get("p");
  const post = slug && posts.find((p) => p.slug === slug);

  if (post) {
    // Per-article title, description and Article schema: what Google reads.
    document.title = `${post.title} | Jewelree Journal`;
    document.querySelector('meta[name="description"]').content = post.meta;
    const ld = document.createElement("script"); ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "Article", headline: post.title, description: post.meta, datePublished: post.date, author: { "@type": "Organization", name: "Jewelree Atelier" } });
    document.head.appendChild(ld);
    const related = JW.products().filter((p) => !p.hidden && (p.art === post.art || p.bg === post.bg)).slice(0, 3);
    main.innerHTML = `<article>
      <div class="crumbs"><a href="index.html">Beranda</a> / <a href="journal.html">Journal</a></div>
      <h1>${JW.esc(post.title)}</h1>
      <span class="meta">${JW.date(post.date)} · ${mins(post)} menit baca · Atelier Jewelree</span>
      <div class="cover">${Art.svg(post.art, post.bg)}</div>
      <div class="body">${post.body.map((p) => `<p>${JW.esc(p).replace("halaman Cek Keaslian", '<a href="verify.html">halaman Cek Keaslian</a>')}</p>`).join("")}</div>
      <div class="shop-the-story"><h2>Shop the story</h2><div class="grid">${related.map(Site.card).join("")}</div></div>
      <div class="seo-note"><b>Kenapa ada artikel di toko perhiasan?</b> Orang mencari “${JW.esc(post.keyword)}” di Google jauh sebelum siap membeli. Artikel seperti ini membuat Jewelree muncul di pencarian itu, lalu mengarahkan pembaca ke produk dan halaman cek keaslian.</div>
    </article>`;
    Site.bindWish(main);
  } else {
    const [first, ...rest] = posts;
    main.innerHTML = `<header class="j-head"><span class="eyebrow">Journal</span><h1>The <em>modern</em> heirloom</h1><p>Panduan memilih, merawat, dan memastikan keaslian perhiasan — ditulis oleh atelier kami.</p></header>
      <a class="feature" href="?p=${first.slug}"><div class="pic">${Art.svg(first.art, first.bg)}</div><div><span class="meta">${JW.date(first.date)} · ${mins(first)} menit baca</span><h2>${JW.esc(first.title)}</h2><p>${JW.esc(first.meta)}</p><p style="margin-top:20px"><span class="btn btn-line">Baca</span></p></div></a>
      <div class="list">${rest.map((p) => `<a href="?p=${p.slug}"><div class="pic">${Art.svg(p.art, p.bg)}</div><span class="meta">${JW.date(p.date)} · ${mins(p)} menit</span><h3>${JW.esc(p.title)}</h3></a>`).join("")}</div>`;
  }
</script>
</body>
</html>
