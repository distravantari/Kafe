<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kafe Back Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/mascot.svg">
  <style>
    :root {
      --surface: #fff;
      --line: #ece3d1;
      --muted: #8a7f6c;
      /* Categorical chart slots — validated (CVD ΔE ≥ 9, contrast ≥ 3:1 on white) */
      --s1: #a8432c; --s2: #b07f1a; --s3: #13886a;
    }
    body { background: #f7f1e5; display: grid; grid-template-columns: 240px 1fr; min-height: 100dvh; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    input, select, textarea { font: inherit; color: var(--bean); }

    /* Sidebar */
    .side { background: var(--brick); color: var(--cream); padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100dvh; }
    .side .logo { font-size: 2.2rem; padding: 0 10px 4px; }
    .side .sub { font-family: var(--font-display); font-size: .75rem; letter-spacing: .14em; opacity: .7; padding: 0 10px 22px; }
    .side a.nav { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; text-decoration: none; font-family: var(--font-display); font-weight: 500; opacity: .8; }
    .side a.nav svg { width: 20px; height: 20px; flex-shrink: 0; }
    .side a.nav:hover { background: rgba(242,230,207,.08); opacity: 1; }
    .side a.nav.on { background: var(--cream); color: var(--brick); opacity: 1; }
    .side .spacer { flex: 1; }
    .side .to-pos { justify-content: center; }

    main { padding: 28px clamp(16px, 3vw, 40px) 60px; min-width: 0; }
    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .page-head h1 { font-size: clamp(2rem, 4vw, 2.8rem); color: var(--maroon); }
    .page-head p { color: var(--muted); margin-top: 6px; }

    .seg { display: inline-flex; background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; }
    .seg button { padding: 8px 16px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: .9rem; color: var(--muted); }
    .seg button.on { background: var(--brick); color: var(--cream); }

    .card { background: var(--surface); border-radius: var(--radius); padding: 20px 22px; border: 1.5px solid var(--line); min-width: 0; }
    .card h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--maroon); letter-spacing: 0; margin-bottom: 4px; line-height: 1.2; }
    .card .hint { color: var(--muted); font-size: .85rem; margin-bottom: 14px; }

    /* Sample banner */
    .banner { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--crema); color: var(--maroon); padding: 14px 18px; border-radius: 18px; margin-bottom: 22px; }
    .banner b { font-family: var(--font-display); }
    .banner .actions { display: flex; gap: 8px; }
    .pill { padding: 8px 16px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: .9rem; border: 2px solid currentColor; }
    .pill.solid { background: var(--brick); color: var(--cream); border-color: var(--brick); }

    /* Features */
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 26px; }
    .feature { background: var(--maroon); color: var(--cream); border-radius: var(--radius); padding: 18px 20px; text-decoration: none; display: flex; flex-direction: column; gap: 6px; transition: transform .15s; }
    .feature:hover { transform: translateY(-2px); }
    .feature b { font-family: var(--font-display); font-size: 1.1rem; color: var(--crema); }
    .feature span { font-size: .88rem; opacity: .8; }
    .features-title { font-family: var(--font-display); font-weight: 600; color: var(--maroon); margin-bottom: 10px; }

    /* KPIs */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
    .kpi .label { color: var(--muted); font-size: .85rem; }
    .kpi .val { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 2.4vw, 2rem); color: var(--bean); line-height: 1.15; margin: 4px 0; }
    .kpi .delta { font-size: .82rem; font-weight: 500; color: var(--muted); }
    .kpi .delta.up { color: #1d7a4f; } .kpi .delta.down { color: #b3261e; }

    .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-bottom: 14px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

    /* Charts */
    .chart { position: relative; }
    .chart svg { width: 100%; height: auto; overflow: visible; }
    .chart .grid line { stroke: var(--line); stroke-width: 1; }
    .chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); }
    .chart .bar { fill: var(--brick); }
    .chart .hit:hover + .bar, .chart .bar.hl { fill: var(--maroon); }
    .chart .hit { fill: transparent; cursor: default; }
    .tip { position: fixed; pointer-events: none; background: var(--bean); color: var(--cream); padding: 8px 12px; border-radius: 10px; font-size: .85rem; z-index: 50; opacity: 0; transition: opacity .1s; white-space: nowrap; }
    .tip b { font-family: var(--font-display); display: block; }
    .tip.show { opacity: 1; }

    .hbars { display: flex; flex-direction: column; gap: 10px; }
    .hbar { display: grid; grid-template-columns: minmax(90px, 1fr) 2fr 56px; gap: 10px; align-items: center; font-size: .9rem; }
    .hbar .track { height: 12px; border-radius: 0 4px 4px 0; background: transparent; }
    .hbar .fill { height: 100%; background: var(--brick); border-radius: 0 4px 4px 0; min-width: 2px; }
    .hbar .num { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    .hbar .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .stack { display: flex; height: 28px; gap: 2px; margin: 10px 0 12px; }
    .stack div { min-width: 2px; }
    .stack div:first-child { border-radius: 6px 0 0 6px; } .stack div:last-child { border-radius: 0 6px 6px 0; }
    .legend { display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
    .legend div { display: flex; align-items: center; gap: 8px; }
    .legend i { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
    .legend span:last-child { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* Tables */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .toolbar input, .toolbar select, .field input, .field select, .field textarea { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; outline: none; }
    .toolbar input:focus, .field input:focus, .field select:focus, .field textarea:focus, td input:focus { border-color: var(--brick); }
    .toolbar input[type=search] { flex: 1; min-width: 180px; }
    .table-wrap { position: relative; overflow-x: auto; background: #fff; border-radius: var(--radius); border: 1.5px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th { text-align: left; font-family: var(--font-display); font-weight: 600; color: var(--maroon); padding: 14px 16px; border-bottom: 1.5px solid var(--line); white-space: nowrap; background: #fcf8f0; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr.click { cursor: pointer; }
    tbody tr.click:hover { background: #fcf8f0; }
    td input { border: 1.5px solid transparent; border-radius: 8px; padding: 6px 8px; width: 100%; background: transparent; outline: none; }
    td input:hover { border-color: var(--line); }
    td input.price { text-align: right; width: 110px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-family: var(--font-display); font-weight: 600; background: #f3ebdb; color: var(--bean); }
    .badge i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
    .muted { color: var(--muted); }
    .empty-row { text-align: center; padding: 40px; color: var(--muted); }

    .switch { position: relative; width: 44px; height: 26px; display: inline-block; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; background: #d8cdb6; border-radius: 999px; transition: .2s; cursor: pointer; }
    .switch span::after { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + span { background: #1d7a4f; }
    .switch input:checked + span::after { transform: translateX(18px); }
    .switch input:focus-visible + span { outline: 3px solid var(--crema); }
    .icon-btn { padding: 6px 10px; border-radius: 8px; color: var(--muted); }
    .icon-btn:hover { background: #f3ebdb; color: #b3261e; }

    /* Drawer / dialog */
    dialog { border: 0; border-radius: var(--radius-lg); padding: 0; width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); margin: auto; background: var(--cream); color: var(--bean); }
    dialog::backdrop { background: rgba(93,16,9,.5); }
    .dlg-head { background: var(--brick); color: var(--cream); padding: 20px 24px; display: flex; justify-content: space-between; align-items: start; }
    .dlg-head h3 { font-size: 1.6rem; }
    .dlg-head p { opacity: .8; font-size: .9rem; }
    .dlg-head [data-close] { font-size: 1.6rem; line-height: 1; }
    .dlg-body { padding: 20px 24px; }
    .dlg-body ul { list-style: none; }
    .dlg-body li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #d8cdb6; }
    .dlg-body li small { display: block; color: var(--muted); }
    .sumgrid { display: grid; grid-template-columns: 1fr auto; gap: 4px; margin-top: 12px; }
    .sumgrid b { font-family: var(--font-display); color: var(--brick); font-size: 1.15rem; }
    .sumgrid :nth-child(even) { text-align: right; }

    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > span { font-family: var(--font-display); font-weight: 600; font-size: .9rem; color: var(--maroon); }
    .field.full { grid-column: 1/-1; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px; }
    .checks label { display: inline-flex; gap: 6px; align-items: center; background: #fff; border: 1.5px solid var(--line); padding: 6px 12px; border-radius: 999px; font-size: .88rem; cursor: pointer; }
    .dlg-foot { padding: 0 24px 22px; display: flex; gap: 10px; justify-content: flex-end; }
    .btn-ghost-dark { color: var(--brick); border-color: var(--brick); }

    .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
    .danger { color: #b3261e; border-color: #b3261e; }
    .saved { color: #1d7a4f; font-size: .9rem; opacity: 0; transition: opacity .2s; }
    .saved.show { opacity: 1; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid2, .grid3 { grid-template-columns: 1fr; } }
    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; }
      .side { position: sticky; top: 0; z-index: 10; height: auto; flex-direction: row; align-items: center; padding: 10px 12px; overflow-x: auto; gap: 4px; }
      .side .logo { font-size: 1.6rem; padding: 0 6px; }
      .side .sub, .side .spacer { display: none; }
      .side a.nav { padding: 8px 12px; white-space: nowrap; }
      .side a.nav svg { display: none; }
      .form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<aside class="side">
  <a href="index.html" class="logo">Kafe<span class="bean"></span></a>
  <span class="sub">BACK OFFICE</span>
  <a class="nav" href="#overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Overview</a>
  <a class="nav" href="#orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Orders</a>
  <a class="nav" href="#menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h12l-1.5 12h-9zM17 10h1a3 3 0 0 1 0 6h-1.5M9 3v2M12 3v2"/></svg>Menu</a>
  <a class="nav" href="#settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Settings</a>
  <div class="spacer"></div>
  <a class="nav to-pos" href="kitchen.html" style="border:1.5px solid rgba(242,230,207,.5)">Kitchen display →</a>
  <a class="nav to-pos" href="pos.html" style="border:1.5px solid rgba(242,230,207,.5)">Open POS →</a>
</aside>

<main id="app"></main>

<div class="tip" id="tip" role="tooltip"></div>

<dialog id="order-dlg"></dialog>
<dialog id="item-dlg"></dialog>

<script src="kafe-data.js"></script>
<script src="backoffice.js"></script>
</body>
</html>
