<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kafe Kitchen Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/mascot.svg">
  <style>
    :root { --warn: #b07f1a; --late: #c4321f; --ok: #1d7a4f; }
    html, body { height: 100%; }
    body { background: var(--maroon); color: var(--cream); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

    .bar { display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: var(--brick); flex-wrap: wrap; }
    .bar .logo { font-size: 1.9rem; --logo-bg: var(--brick); }
    .tag { font-family: var(--font-display); font-weight: 600; font-size: .78rem; letter-spacing: .12em; background: var(--maroon); padding: 6px 10px; border-radius: 999px; }
    .seg { display: inline-flex; background: var(--maroon); border-radius: 999px; padding: 3px; }
    .seg button { padding: 8px 16px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: .92rem; opacity: .75; }
    .seg button.on { background: var(--cream); color: var(--brick); opacity: 1; }
    .stat { font-size: .88rem; opacity: .85; }
    .stat b { font-family: var(--font-display); font-size: 1.05rem; color: var(--crema); }
    .bar .right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .chip-btn { padding: 8px 14px; border-radius: 999px; border: 1.5px solid rgba(242,230,207,.5); font-family: var(--font-display); font-weight: 600; font-size: .9rem; text-decoration: none; white-space: nowrap; }
    .chip-btn:hover { background: rgba(242,230,207,.1); }
    .chip-btn.solid { background: var(--cream); color: var(--brick); border-color: var(--cream); }
    #clock { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; min-width: 60px; text-align: right; }

    .board { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px 20px 20px; min-height: 0; }
    .col { display: flex; flex-direction: column; min-height: 0; background: rgba(0,0,0,.14); border-radius: 24px; }
    .col-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 10px; }
    .col-head h2 { font-size: 1.4rem; }
    .col-head .count { font-family: var(--font-display); font-weight: 700; background: var(--cream); color: var(--maroon); min-width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; padding: 0 10px; }
    .col[data-col="new"] .count { background: var(--crema); }
    .tickets { flex: 1; overflow-y: auto; padding: 4px 12px 14px; display: flex; flex-direction: column; gap: 12px; }
    .empty { text-align: center; opacity: .55; padding: 40px 10px; font-family: var(--font-display); }
    .empty [data-mascot] { width: 90px; margin: 0 auto 10px; color: var(--crema); --mascot-fill: transparent; }

    .ticket { background: var(--cream); color: var(--bean); border-radius: 18px; overflow: hidden; box-shadow: 0 10px 24px -14px rgba(0,0,0,.6); animation: drop .35s ease; }
    @keyframes drop { from { transform: translateY(-8px); opacity: 0; } }
    .t-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--brick); color: var(--cream); }
    .t-head .no { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; }
    .t-head .type { font-size: .78rem; font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: rgba(0,0,0,.2); padding: 4px 9px; border-radius: 999px; }
    .t-head .timer { margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
    .ticket.warn .t-head { background: var(--warn); }
    .ticket.late .t-head { background: var(--late); }
    .ticket.late .timer::before { content: "!"; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--cream); color: var(--late); font-size: .85rem; }
    .ticket.late { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(196,50,31,.45); } }
    .ticket.ready .t-head { background: var(--ok); }

    .t-lines { list-style: none; padding: 6px 8px; }
    .t-line { display: grid; grid-template-columns: 36px 1fr; gap: 8px; padding: 8px 6px; border-radius: 10px; cursor: pointer; align-items: start; }
    .t-line:hover { background: rgba(154,59,38,.06); }
    .t-line .q { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--brick); text-align: center; background: #fff; border-radius: 8px; padding: 2px 0; }
    .t-line b { font-family: var(--font-display); font-weight: 600; font-size: 1.08rem; display: block; line-height: 1.25; }
    .mods { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .mods span { font-size: .78rem; font-weight: 700; background: var(--crema); color: var(--maroon); padding: 2px 8px; border-radius: 6px; }
    .note { display: block; margin-top: 4px; font-size: .88rem; font-style: italic; color: var(--brick); }
    .t-line.done { opacity: .4; }
    .t-line.done b { text-decoration: line-through; }
    .t-line.done .q::after { content: "✓"; }
    .t-line.done .q { color: var(--ok); font-size: 0; } .t-line.done .q::after { font-size: 1.1rem; }
    .t-line.other { opacity: .35; cursor: default; }
    .t-line.other .q { background: transparent; }
    .t-foot { display: flex; gap: 8px; padding: 6px 12px 12px; }
    .t-foot .go { flex: 1; padding: 12px; border-radius: 12px; background: var(--brick); color: var(--cream); font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
    .t-foot .go:hover { background: var(--maroon); }
    .ticket.ready .t-foot .go { background: var(--ok); }
    .t-foot .back { padding: 12px 14px; border-radius: 12px; color: var(--muted, #8a7f6c); border: 1.5px solid #e2d4b8; font-size: .9rem; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120px); background: var(--cream); color: var(--maroon); padding: 12px 20px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; transition: transform .25s; z-index: 10; }
    .toast.show { transform: translateX(-50%); }

    @media (max-width: 900px) {
      body { overflow: auto; height: auto; min-height: 100dvh; }
      .bar .stat { display: none; }
      .board { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding: 14px 16px; }
      .col { flex: 0 0 86%; scroll-snap-align: start; max-height: calc(100dvh - 150px); }
    }
    @media (prefers-reduced-motion: reduce) { .ticket, .ticket.late { animation: none; } }
  </style>
</head>
<body>

<header class="bar">
  <a href="index.html" class="logo" aria-label="Kafe home">Kafe<span class="bean"></span></a>
  <span class="tag">KITCHEN</span>
  <div class="seg" role="group" aria-label="Station">
    <button data-station="All">All</button><button data-station="Bar">Bar</button><button data-station="Kitchen">Kitchen</button>
  </div>
  <span class="stat">Avg. make time today <b id="avg">—</b></span>
  <span class="stat">Served today <b id="served">0</b></span>
  <div class="right">
    <button class="chip-btn" id="sound" aria-pressed="false">🔕 Sound off</button>
    <button class="chip-btn" id="recall">↺ Recall</button>
    <button class="chip-btn solid" id="test">+ Test order</button>
    <a class="chip-btn" href="pos.html">POS</a>
    <a class="chip-btn" href="backoffice.html">Back office</a>
    <span id="clock"></span>
  </div>
</header>

<main class="board">
  <section class="col" data-col="new"><div class="col-head"><h2>New</h2><span class="count" id="c-new">0</span></div><div class="tickets" id="t-new"></div></section>
  <section class="col" data-col="making"><div class="col-head"><h2>Making</h2><span class="count" id="c-making">0</span></div><div class="tickets" id="t-making"></div></section>
  <section class="col" data-col="ready"><div class="col-head"><h2>Ready</h2><span class="count" id="c-ready">0</span></div><div class="tickets" id="t-ready"></div></section>
</main>

<div class="toast" id="toast"></div>

<script src="mascot.js"></script>
<script src="kafe-data.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const WARN_MIN = 5, LATE_MIN = 10;
  const HIDE = ["Normal", "Regular", "Whole", "No", "As is"];
  let station = KafeStore.get("kafe.kds.station", "All");
  let sound = KafeStore.get("kafe.kds.sound", false);
  let known = null; // order numbers already on screen, to detect new arrivals
  let lastSig = "";

  const pad = (n) => String(n).padStart(3, "0");
  const elapsed = (iso) => { const s = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const ageClass = (iso) => { const m = (Date.now() - new Date(iso)) / 60000; return m >= LATE_MIN ? "late" : m >= WARN_MIN ? "warn" : ""; };
  const prepLines = (o) => o.lines.map((l, i) => ({ ...l, i, st: Kafe.station(l.cat) })).filter((l) => l.st);

  function active() {
    return Kafe.orders().filter((o) => ["new", "making", "ready"].includes(o.status) && prepLines(o).length)
      .filter((o) => station === "All" || prepLines(o).some((l) => l.st === station))
      .sort((a, b) => new Date(a.at) - new Date(b.at));
  }

  function ticket(o) {
    const done = o.doneLines || [];
    const next = { new: "Start", making: "Mark ready", ready: o.type === "Takeaway" ? "Picked up" : "Served" }[o.status];
    return `<article class="ticket ${o.status === "ready" ? "ready" : ageClass(o.at)}" data-no="${o.no}">
      <div class="t-head"><span class="no">#${pad(o.no)}</span><span class="type">${o.type}</span><span class="timer" data-since="${o.at}">${elapsed(o.at)}</span></div>
      <ul class="t-lines">${prepLines(o).map((l) => {
        const mods = Object.values(l.opts || {}).filter((v) => !HIDE.includes(v));
        const other = station !== "All" && l.st !== station;
        return `<li class="t-line ${done.includes(l.i) ? "done" : ""} ${other ? "other" : ""}" ${other ? "" : `data-line="${l.i}"`} title="${other ? `${l.st} item` : "Tap to tick off"}">
          <span class="q">${l.qty}</span><div><b>${l.name}</b>${mods.length ? `<div class="mods">${mods.map((m) => `<span>${m}</span>`).join("")}</div>` : ""}${l.note ? `<span class="note">“${l.note}”</span>` : ""}</div></li>`;
      }).join("")}</ul>
      <div class="t-foot">${o.status !== "new" ? `<button class="back" data-back="${o.no}" aria-label="Move back">←</button>` : ""}<button class="go" data-go="${o.no}">${next} →</button></div>
    </article>`;
  }

  function render(force) {
    const list = active();
    const sig = JSON.stringify([station, list.map((o) => [o.no, o.status, o.doneLines])]);
    if (!force && sig === lastSig) return tick();
    lastSig = sig;

    // chime for orders we haven't seen yet
    const nos = new Set(list.map((o) => o.no));
    if (known && [...nos].some((n) => !known.has(n))) chime();
    known = nos;

    for (const col of ["new", "making", "ready"]) {
      const ts = list.filter((o) => o.status === col);
      $("#c-" + col).textContent = ts.length;
      $("#t-" + col).innerHTML = ts.map(ticket).join("") || (col === "new"
        ? `<div class="empty"><div data-mascot></div>All caught up.<br><span style="font-size:.9rem">New POS orders land here.</span></div>`
        : `<div class="empty">Nothing here</div>`);
    }
    window.injectMascots && window.injectMascots();
    document.querySelectorAll("[data-station]").forEach((b) => b.classList.toggle("on", b.dataset.station === station));
    stats();
  }

  function tick() {
    document.querySelectorAll("[data-since]").forEach((el) => {
      el.textContent = elapsed(el.dataset.since);
      const t = el.closest(".ticket");
      if (!t.classList.contains("ready")) { t.classList.remove("warn", "late"); const c = ageClass(el.dataset.since); if (c) t.classList.add(c); }
    });
    $("#clock").textContent = new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  }

  function stats() {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const today = Kafe.orders().filter((o) => !o.sample && new Date(o.at) >= start);
    const made = today.filter((o) => o.readyAt);
    $("#served").textContent = today.filter((o) => o.status === "done" && o.doneAt).length;
    if (made.length) {
      const s = made.reduce((a, o) => a + (new Date(o.readyAt) - new Date(o.at)), 0) / made.length / 1000;
      $("#avg").textContent = `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
    } else $("#avg").textContent = "—";
  }

  function advance(no, dir) {
    const flow = ["new", "making", "ready", "done"];
    const stamp = { making: "startedAt", ready: "readyAt", done: "doneAt" };
    Kafe.updateOrder(no, (o) => {
      const next = flow[Math.max(0, Math.min(3, flow.indexOf(o.status) + dir))];
      const patch = { status: next };
      if (dir > 0 && stamp[next]) patch[stamp[next]] = new Date().toISOString();
      if (next === "ready") patch.doneLines = prepLines(o).map((l) => l.i);
      if (dir > 0 && next === "done") toast(`#${pad(no)} ${o.type === "Takeaway" ? "picked up" : "served"} · Recall to undo`);
      return patch;
    });
    render();
  }

  function testOrder() {
    const menu = Kafe.menu().filter((m) => m.available && Kafe.station(m.cat));
    const pick = () => menu[Math.floor(Math.random() * menu.length)];
    const lines = Array.from({ length: 1 + Math.floor(Math.random() * 3) }, () => {
      const m = pick(); const opts = {}; let unit = m.price;
      (m.opts || []).forEach((k) => { const c = OPT[k].choices[Math.random() < 0.6 ? 0 : Math.floor(Math.random() * OPT[k].choices.length)]; opts[k] = c[0]; unit += c[1]; });
      return { id: m.id, name: m.name, cat: m.cat, unit, qty: Math.random() < 0.8 ? 1 : 2, opts, note: Math.random() < 0.2 ? ["Extra hot", "Name: Dita", "No ice please", "Cut in half"][Math.floor(Math.random() * 4)] : "" };
    });
    const s = Kafe.settings();
    const subtotal = lines.reduce((a, l) => a + l.unit * l.qty, 0), tax = Math.round(subtotal * s.taxRate / 100);
    const no = Kafe.orders().reduce((a, o) => Math.max(a, o.no), 0) + 1;
    Kafe.addOrder({ no, at: new Date().toISOString(), type: Math.random() < 0.6 ? "Dine in" : "Takeaway", method: "QRIS", lines, subtotal, tax, total: subtotal + tax, paid: subtotal + tax, status: "new", sample: true });
    render();
  }

  function chime() {
    if (!sound) return;
    try {
      const ctx = chime.ctx || (chime.ctx = new AudioContext());
      [660, 880].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f; o.type = "sine"; o.connect(g); g.connect(ctx.destination);
        const t = ctx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        o.start(t); o.stop(t + 0.32);
      });
    } catch {}
  }

  let toastTimer;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }

  function setSound(v) { sound = v; KafeStore.set("kafe.kds.sound", v); $("#sound").textContent = v ? "🔔 Sound on" : "🔕 Sound off"; $("#sound").setAttribute("aria-pressed", v); }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-station], [data-go], [data-back], [data-line], #sound, #recall, #test");
    if (!t) return;
    if (t.dataset.station) { station = t.dataset.station; KafeStore.set("kafe.kds.station", station); render(true); }
    else if (t.dataset.go) advance(+t.dataset.go, 1);
    else if (t.dataset.back) advance(+t.dataset.back, -1);
    else if (t.dataset.line) {
      const no = +t.closest(".ticket").dataset.no, i = +t.dataset.line;
      Kafe.updateOrder(no, (o) => {
        const d = new Set(o.doneLines || []); d.has(i) ? d.delete(i) : d.add(i);
        return { doneLines: [...d], ...(o.status === "new" ? { status: "making", startedAt: new Date().toISOString() } : {}) };
      });
      render();
    }
    else if (t.id === "sound") { setSound(!sound); if (sound) chime(); }
    else if (t.id === "test") testOrder();
    else if (t.id === "recall") {
      const last = Kafe.orders().filter((o) => o.status === "done" && o.doneAt).sort((a, b) => new Date(b.doneAt) - new Date(a.doneAt))[0];
      if (last) { Kafe.updateOrder(last.no, { status: "ready", doneAt: null }); toast(`#${pad(last.no)} recalled`); render(); }
      else toast("Nothing to recall yet");
    }
  });

  window.addEventListener("storage", (e) => { if (e.key === "kafe.orders" || e.key === "kafe.menu") render(); });
  setInterval(render, 2000);   // also catches orders from this same browser
  setInterval(tick, 1000);
  setSound(sound);
  render(true);
</script>
</body>
</html>
